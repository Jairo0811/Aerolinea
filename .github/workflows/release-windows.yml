name: Build and Release AerolineaCPP

on:
  pull_request:
    paths:
      - ".github/workflows/release-windows.yml"
      - "modern-qt-sqlserver/**"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-windows.yml"
      - "modern-qt-sqlserver/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (for example, v1.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aerolinea-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      package_name: ${{ steps.metadata.outputs.package_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Resolve and validate package metadata
        id: metadata
        shell: pwsh
        env:
          RELEASE_INPUT: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $version = $env:RELEASE_INPUT
            if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
              throw "La versión debe tener formato SemVer, por ejemplo v1.1.0."
            }
          }
          else {
            $version = "ci-$($env:COMMIT_SHA.Substring(0, 12))"
          }

          $packageName = "AerolineaCPP-$version-Windows-x64"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT
          "package_name=$packageName" >> $env:GITHUB_OUTPUT

      - name: Configure
        shell: pwsh
        run: cmake -S modern-qt-sqlserver -B build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Prepare portable package
        shell: pwsh
        run: |
          $packageDir = Join-Path $PWD "dist\$env:PACKAGE_NAME"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $exe = Get-ChildItem -Path build -Filter AerolineaCPP.exe -Recurse |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No se encontró AerolineaCPP.exe en la compilación Release."
          }

          Copy-Item $exe.FullName (Join-Path $packageDir "AerolineaCPP.exe")
          windeployqt --release --compiler-runtime --no-translations (Join-Path $packageDir "AerolineaCPP.exe")

          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir "config") | Out-Null
          Copy-Item "modern-qt-sqlserver\config\database.example.ini" (Join-Path $packageDir "config\database.example.ini")
          Copy-Item "modern-qt-sqlserver\Aerolinea.sql" (Join-Path $packageDir "Aerolinea.sql")

          $readmeLines = @(
            "AerolineaCPP $env:RELEASE_VERSION",
            "=====================",
            "",
            "REQUISITOS",
            "- Windows 10/11 x64",
            "- Microsoft ODBC Driver 17 for SQL Server",
            "- Microsoft SQL Server con TLS configurado",
            "",
            "INSTALACIÓN",
            "1. Ejecuta Aerolinea.sql en SQL Server.",
            "2. Copia config\database.example.ini como config\database.ini.",
            "3. Configura la instancia; no guardes contraseñas en el archivo.",
            "4. Para autenticación SQL, define AEROLINEA_DB_USER y AEROLINEA_DB_PASSWORD.",
            "5. Ejecuta AerolineaCPP.exe."
          )
          $readmeLines | Set-Content -Encoding UTF8 (Join-Path $packageDir "LEEME.txt")

          $zipPath = "dist\$env:PACKAGE_NAME.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force
          (Get-FileHash -Algorithm SHA256 $zipPath).Hash.ToLowerInvariant() |
            Set-Content -Encoding ascii "$zipPath.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.package_name }}
          path: |
            dist/${{ steps.metadata.outputs.package_name }}.zip
            dist/${{ steps.metadata.outputs.package_name }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build-windows
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Download verified build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-windows.outputs.package_name }}
          path: dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build-windows.outputs.version }}
          PACKAGE_NAME: ${{ needs.build-windows.outputs.package_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          $zipPath = Join-Path $PWD "dist\$env:PACKAGE_NAME.zip"
          $hashPath = "$zipPath.sha256"
          if (-not (Test-Path $zipPath) -or -not (Test-Path $hashPath)) {
            throw "El artefacto o su checksum no están disponibles."
          }

          $notesFile = Join-Path $PWD "release-notes.md"
          $checksum = (Get-Content $hashPath -Raw).Trim()
          $notes = @(
            "## AerolineaCPP $env:RELEASE_VERSION",
            "",
            "Aplicación de escritorio Qt 6 con acceso de solo lectura a SQL Server.",
            "",
            "### Instalación segura",
            "",
            '- Mantén `encrypt=true` y usa un certificado válido del servidor.',
            "- Usa autenticación integrada o las variables de entorno documentadas.",
            '- Asigna al usuario únicamente el rol `AerolineaReader`.',
            "",
            ('SHA-256: `{0}`' -f $checksum)
          )
          $notes | Set-Content -Encoding UTF8 $notesFile

          if (gh release view $env:RELEASE_VERSION 2>$null) {
            gh release upload $env:RELEASE_VERSION $zipPath $hashPath --clobber
            gh release edit $env:RELEASE_VERSION --notes-file $notesFile
          }
          else {
            gh release create $env:RELEASE_VERSION $zipPath $hashPath `
              --target $env:TARGET_SHA `
              --title "AerolineaCPP $env:RELEASE_VERSION" `
              --notes-file $notesFile
          }
