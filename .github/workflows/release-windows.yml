name: Build and Release AerolineaCPP

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish"
        required: false
        default: "v1.0.0"
  push:
    branches:
      - master
    paths:
      - ".github/workflows/release-windows.yml"
      - "modern-qt-sqlserver/**"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_msvc2022_64"
          cache: true

      - name: Resolve version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "v1.0.0"
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: cmake -S modern-qt-sqlserver -B build -A x64

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Prepare portable package
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          $packageName = "AerolineaCPP-$version-Windows-x64"
          $packageDir = Join-Path $PWD "dist\$packageName"

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $exe = Get-ChildItem -Path build -Filter AerolineaCPP.exe -Recurse |
            Where-Object { $_.FullName -match '\\Release\\' } |
            Select-Object -First 1

          if (-not $exe) {
            throw "No se encontró AerolineaCPP.exe en la compilación Release."
          }

          Copy-Item $exe.FullName (Join-Path $packageDir "AerolineaCPP.exe")

          windeployqt --release --compiler-runtime --no-translations (Join-Path $packageDir "AerolineaCPP.exe")

          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir "config") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $packageDir "branding") | Out-Null

          if (Test-Path "modern-qt-sqlserver\config\database.example.ini") {
            Copy-Item "modern-qt-sqlserver\config\database.example.ini" (Join-Path $packageDir "config\database.example.ini")
          }

          if (Test-Path "modern-qt-sqlserver\Aerolinea.sql") {
            Copy-Item "modern-qt-sqlserver\Aerolinea.sql" (Join-Path $packageDir "Aerolinea.sql")
          }

          Copy-Item "modern-qt-sqlserver\aerolineacpp_logo.png" (Join-Path $packageDir "branding\aerolineacpp_logo.png")
          Copy-Item "modern-qt-sqlserver\itla_logo.png" (Join-Path $packageDir "branding\itla_logo.png")

          $readmeLines = @(
            "AerolineaCPP $version",
            "=====================",
            "",
            "Legacy Restoration Edition",
            "",
            "REQUISITOS",
            "- Windows 10/11 x64",
            "- Microsoft ODBC Driver 17 for SQL Server",
            "- Microsoft SQL Server",
            "",
            "INSTALACIÓN",
            "1. Ejecuta Aerolinea.sql en SQL Server.",
            "2. Copia config\database.example.ini como config\database.ini.",
            "3. Configura la instancia de SQL Server en database.ini.",
            "4. Ejecuta AerolineaCPP.exe.",
            "",
            "Repositorio:",
            "https://github.com/Jairo0811/Aerolinea"
          )

          $readmeLines | Set-Content -Encoding UTF8 (Join-Path $packageDir "LEEME.txt")

          Compress-Archive -Path "$packageDir\*" -DestinationPath "dist\$packageName.zip" -Force

          "PACKAGE_NAME=$packageName" >> $env:GITHUB_ENV
          "PACKAGE_ZIP=dist\$packageName.zip" >> $env:GITHUB_ENV

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: ${{ env.PACKAGE_ZIP }}

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:RELEASE_VERSION
          $notesFile = Join-Path $PWD "release-notes.md"

          $notes = @(
            "## ✈️ AerolineaCPP $version",
            "",
            "Primera versión estable de la modernización de **Aerolinea**, proyecto final desarrollado originalmente para **Estructuras de Datos (SOF-012)** en el ITLA durante el período **2018-C1**.",
            "",
            "### 🚀 Características",
            "",
            "- Interfaz responsive rediseñada con Qt 6 Widgets.",
            "- Identidad visual azul oscuro y cyan de AerolineaCPP.",
            "- Persistencia con Microsoft SQL Server.",
            "- Gestión de destinos, rutas, vuelos y aeronaves.",
            "- Búsqueda de rutas con escalas.",
            "- Cálculo de distancia, duración y precio total.",
            "- Configuración portable mediante database.ini.",
            "- Ventana Acerca de con créditos académicos y logo institucional del ITLA.",
            "- Carga de logos con fallback externo para garantizar compatibilidad en la versión portable.",
            "- Preservación de la versión Legacy original.",
            "",
            "### 📦 Instalación",
            "",
            "1. Descarga AerolineaCPP-$version-Windows-x64.zip.",
            "2. Extrae su contenido completo.",
            "3. Ejecuta Aerolinea.sql.",
            "4. Copia config/database.example.ini como config/database.ini.",
            "5. Configura tu instancia de SQL Server.",
            "6. Ejecuta AerolineaCPP.exe.",
            "",
            "**Estado:** versión estable para portafolio y demostración."
          )

          $notes | Set-Content -Encoding UTF8 $notesFile

          if (gh release view $version 2>$null) {
            gh release upload $version "${{ env.PACKAGE_ZIP }}" --clobber
            gh release edit $version --title "AerolineaCPP $version — Legacy Restoration Edition" --notes-file $notesFile
          }
          else {
            gh release create $version "${{ env.PACKAGE_ZIP }}" --target master --title "AerolineaCPP $version — Legacy Restoration Edition" --notes-file $notesFile
          }
