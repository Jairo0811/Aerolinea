; Plantilla de configuración de AerolineaCPP.
;
; Modo instalado: la aplicación crea una copia editable de esta plantilla en
;   %LOCALAPPDATA%\JM Software Solutions\AerolineaCPP\database.ini
; Modo portable: copia este archivo como config\database.ini junto a
;   AerolineaCPP.exe; esa copia tiene prioridad.
;
; No guardes contraseñas aquí. Para autenticación SQL usa las variables de
; entorno AEROLINEA_DB_USER y AEROLINEA_DB_PASSWORD con trustedConnection=false.
[database]
driver=ODBC Driver 17 for SQL Server
server=localhost\\SQLEXPRESS
database=AerolineaDB
trustedConnection=true
encrypt=true
trustServerCertificate=false
